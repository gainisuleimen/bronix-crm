# Render Blueprint: https://render.com/docs/blueprint-spec
# После деплоя укажите FRONTEND_URL = URL вашего frontend на Vercel.

databases:
  - name: crm-diplom-db
    plan: free
    databaseName: crm_diplom
    user: crm_diplom

services:
  - type: web
    name: crm-diplom-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crm-diplom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: FRONTEND_URL
        sync: false
